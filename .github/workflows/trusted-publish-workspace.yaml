# Generated by simit. Manual edits will be reported as ci=drift.
# Enroll only after moving CRATES_IO_API_TOKEN into the literal environment below,
# restricting it to the exact protected default branch, and qualifying the engine revision.
# Tag-controlled workflows must have no repository/org publishing credential.
# Recovery: rerun the original signed-tag run; matching immutable archives remain reusable.
name: Trusted Crate Publisher

on:
  workflow_run:
    workflows: ["Build Workspace Crates"]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: simit-crates-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  verify-chaosbox-core:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Require independently qualified publisher engine
        env:
          PUBLISHER_REVISION: ${{ vars.SIMIT_PUBLISHER_REVISION }}
        run: |
          set -euo pipefail
          [[ "$PUBLISHER_REVISION" =~ ^[0-9a-f]{40}$ ]] || { echo 'Enroll a qualified immutable Simit publisher revision' >&2; exit 1; }
      - name: Checkout independent publisher source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Checkout qualified publisher engine
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: caniko/simit
          ref: ${{ vars.SIMIT_PUBLISHER_REVISION }}
          path: .simit-publisher-engine
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Build trusted publisher engine
        working-directory: /
        run: cargo build --release --locked --manifest-path "$GITHUB_WORKSPACE/.simit-publisher-engine/Cargo.toml" --target-dir "$GITHUB_WORKSPACE/.simit-publisher-engine/target"
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
