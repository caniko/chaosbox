# Generated by simit. Manual edits will be reported as ci=drift.
# Credential-free signed-tag build. Rerun the original signed-tag run for recovery.
name: Build Workspace Crates

# GitHub crates.io publishers run only on signed semver tag pushes. Retry the original run rather than dispatching a branch.
on:
  push:
    tags:
      - "[0-9]*"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 305
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            substituters = https://cache.nixos.org https://attic.candee.baby/nixpkgs-review-gha
            trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY= nixpkgs-review-gha:0fg7mYWpk0A2L627XE3tdW56J8dvZ2Y/+ATNjkcMfIE=

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate signed release tag
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${FORGE_REF_NAME:-${CODEBERG_REF_NAME:-}}}"
          if [ -z "$tag" ]; then
            ref="${GITHUB_REF:-${FORGE_REF:-${CODEBERG_REF:-}}}"
            tag="${ref#refs/tags/}"
          fi

          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2
            exit 1
          fi
          if ! command -v gpg >/dev/null 2>&1; then
            if command -v apt-get >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends gnupg
            else
              echo "gpg is required to verify signed release tags" >&2
              exit 1
            fi
          fi
          git_fetch() {
            if [ -n "${GITHUB_TOKEN:-}" ]; then
              auth_header="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')"
              git -c "http.extraHeader=$auth_header" fetch "$@"
            else
              git fetch "$@"
            fi
          }
          GNUPGHOME="$(mktemp -d)"
          export GNUPGHOME
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          # The release checkout cannot supply its own verification key.
          # Fetch the repository's independently maintained default-branch key.
          git_fetch --no-tags origin HEAD
          git show "FETCH_HEAD:keys/maintainers.gpg" > "$GNUPGHOME/maintainers.gpg"
          test -s "$GNUPGHOME/maintainers.gpg"
          gpg --batch --import "$GNUPGHOME/maintainers.gpg"

          git_fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git verify-tag "$tag"
          signed_tag_name="$(git cat-file tag "refs/tags/$tag" | sed -n '1,/^$/s/^tag //p')"
          test "$signed_tag_name" = "$tag" || { echo 'Signed tag object name differs from the release label' >&2; exit 1; }
          validated_sha="$(git rev-parse --verify "refs/tags/${tag}^{commit}")"
          checkout_sha="$(git rev-parse --verify HEAD)"
          if [ "$validated_sha" != "$checkout_sha" ]; then
            echo "Signed tag commit does not match the checkout being published" >&2
            exit 1
          fi

      - name: Required gate package-inventory
        timeout-minutes: 30
        env:
          SIMIT_REQUIRED_GATE: "1"
        run: set -euo pipefail; for crate in chaosbox-core chaosbox-extract chaosbox-jev chaosbox-store chaosbox-typedb chaosbox; do nix develop -c cargo package -p "$crate" --allow-dirty --list; done
      - name: Required gate release-workspace
        timeout-minutes: 120
        env:
          CARGO_HOME: "/tmp/.cargo"
          NIX_CONFIG: "experimental-features = nix-command flakes"
          XDG_CACHE_HOME: "/tmp/.cache"
        run: set -euo pipefail; if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then export NIX_CONFIG="${NIX_CONFIG}"$'\nmax-jobs = 1\ncores = 2'; test "${GITHUB_EVENT_NAME:-}" = push; git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/; git config --global --add url.https://github.com/.insteadOf git@github.com:; test "${RUNNER_ENVIRONMENT:-}" = github-hosted; test -c /dev/kvm; sudo chmod a+rw /dev/kvm; test -r /dev/kvm; test -w /dev/kvm; git rev-parse HEAD; nix develop --no-update-lock-file -c sh -c 'formatter=$(nix eval --impure --raw --expr "let root = toString ./.; flake = builtins.getFlake (if builtins.pathExists ./.git then \"git+file://\" + root else root); in if flake ? formatter.\${builtins.currentSystem} then flake.formatter.\${builtins.currentSystem}.drvPath else \"\"") || exit; if [ -n "$formatter" ]; then formatter_path=$(nix build --no-link --print-out-paths "$formatter^out") || exit; test -x "$formatter_path/bin/treefmt" || { echo "project formatter does not provide treefmt" >&2; exit 1; }; "$formatter_path/bin/treefmt" --fail-on-change; else echo "project flake must declare formatter for release qualification" >&2; exit 1; fi'; nix develop --no-update-lock-file -c nix flake check --no-update-lock-file --print-build-logs; fi
      - name: Required gate release-nix
        timeout-minutes: 90
        env:
          NIX_CONFIG: "experimental-features = nix-command flakes"
        id: simit-required-gate-release-nix
        run: set -euo pipefail; if [[ "${GITHUB_REF:-}" == refs/tags/* ]]; then test "${GITHUB_EVENT_NAME:-}" = push; git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/; git config --global --add url.https://github.com/.insteadOf git@github.com:; test "${RUNNER_ENVIRONMENT:-}" = github-hosted; test -c /dev/kvm; sudo chmod a+rw /dev/kvm; test -r /dev/kvm; test -w /dev/kvm; git rev-parse HEAD; evidence="$RUNNER_TEMP/chaosbox-release-nix"; mkdir -p "$evidence"; { nix build --no-link --no-update-lock-file --max-jobs 1 --cores 2 --print-build-logs --json .#packages.x86_64-linux.chaosbox .#checks.x86_64-linux.unit .#checks.x86_64-linux.lint .#checks.x86_64-linux.scratch-plugin .#checks.x86_64-linux.federation-home .#checks.x86_64-linux.intelligence-plugin .#checks.x86_64-linux.typedb-integration .#checks.x86_64-linux.federation-ssh 2>&1 >&3 | tee "$evidence/build.log" >&2; } 3>"$evidence/result.json"; fi

      - name: Retain required gate evidence
        if: always() && steps.simit-required-gate-release-nix.outcome != '' && steps.simit-required-gate-release-nix.outcome != 'skipped'
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: "release-nix-evidence.source"
          include-hidden-files: true
          path: "${{ runner.temp }}/chaosbox-release-nix/\n"
          retention-days: 30
          if-no-files-found: warn
      - name: Test chaosbox-core
        run: nix develop -c cargo test --locked -p chaosbox-core --all-targets --all-features
      - name: Clippy chaosbox-core
        run: nix develop -c cargo clippy --locked -p chaosbox-core --all-targets --all-features -- -D warnings
      - name: Document chaosbox-core
        run: nix develop -c cargo doc --locked -p chaosbox-core --no-deps --all-features
      - name: Test chaosbox-extract
        run: nix develop -c cargo test --locked -p chaosbox-extract --all-targets --all-features
      - name: Clippy chaosbox-extract
        run: nix develop -c cargo clippy --locked -p chaosbox-extract --all-targets --all-features -- -D warnings
      - name: Document chaosbox-extract
        run: nix develop -c cargo doc --locked -p chaosbox-extract --no-deps --all-features
      - name: Test chaosbox-jev
        run: nix develop -c cargo test --locked -p chaosbox-jev --all-targets --all-features
      - name: Clippy chaosbox-jev
        run: nix develop -c cargo clippy --locked -p chaosbox-jev --all-targets --all-features -- -D warnings
      - name: Document chaosbox-jev
        run: nix develop -c cargo doc --locked -p chaosbox-jev --no-deps --all-features
      - name: Test chaosbox-store
        run: nix develop -c cargo test --locked -p chaosbox-store --all-targets --all-features
      - name: Clippy chaosbox-store
        run: nix develop -c cargo clippy --locked -p chaosbox-store --all-targets --all-features -- -D warnings
      - name: Document chaosbox-store
        run: nix develop -c cargo doc --locked -p chaosbox-store --no-deps --all-features
      - name: Test chaosbox-typedb
        run: nix develop -c cargo test --locked -p chaosbox-typedb --all-targets --all-features
      - name: Clippy chaosbox-typedb
        run: nix develop -c cargo clippy --locked -p chaosbox-typedb --all-targets --all-features -- -D warnings
      - name: Document chaosbox-typedb
        run: nix develop -c cargo doc --locked -p chaosbox-typedb --no-deps --all-features
      - name: Test chaosbox
        run: nix develop -c cargo test --locked -p chaosbox --all-targets --all-features
      - name: Clippy chaosbox
        run: nix develop -c cargo clippy --locked -p chaosbox --all-targets --all-features -- -D warnings
      - name: Document chaosbox
        run: nix develop -c cargo doc --locked -p chaosbox --no-deps --all-features
      - name: Package coordinated release set
        run: nix develop -c cargo package --locked --allow-dirty --no-verify -p chaosbox-core -p chaosbox-extract -p chaosbox-jev -p chaosbox-store -p chaosbox-typedb -p chaosbox --target-dir "$RUNNER_TEMP/simit-package-target"
      - name: Build immutable archive chaosbox-core
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p chaosbox-core | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/chaosbox-core"
          cp "$RUNNER_TEMP/simit-package-target/package/chaosbox-core-$version.crate" "$RUNNER_TEMP/simit-crates/chaosbox-core/"
      - name: Retain original-run archive chaosbox-core
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-chaosbox-core-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/chaosbox-core/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive chaosbox-extract
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p chaosbox-extract | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/chaosbox-extract"
          cp "$RUNNER_TEMP/simit-package-target/package/chaosbox-extract-$version.crate" "$RUNNER_TEMP/simit-crates/chaosbox-extract/"
      - name: Retain original-run archive chaosbox-extract
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-chaosbox-extract-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/chaosbox-extract/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive chaosbox-jev
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p chaosbox-jev | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/chaosbox-jev"
          cp "$RUNNER_TEMP/simit-package-target/package/chaosbox-jev-$version.crate" "$RUNNER_TEMP/simit-crates/chaosbox-jev/"
      - name: Retain original-run archive chaosbox-jev
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-chaosbox-jev-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/chaosbox-jev/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive chaosbox-store
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p chaosbox-store | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/chaosbox-store"
          cp "$RUNNER_TEMP/simit-package-target/package/chaosbox-store-$version.crate" "$RUNNER_TEMP/simit-crates/chaosbox-store/"
      - name: Retain original-run archive chaosbox-store
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-chaosbox-store-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/chaosbox-store/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive chaosbox-typedb
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p chaosbox-typedb | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/chaosbox-typedb"
          cp "$RUNNER_TEMP/simit-package-target/package/chaosbox-typedb-$version.crate" "$RUNNER_TEMP/simit-crates/chaosbox-typedb/"
      - name: Retain original-run archive chaosbox-typedb
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: simit-crate-chaosbox-typedb-${{ github.run_attempt }}
          path: ${{ runner.temp }}/simit-crates/chaosbox-typedb/*.crate
          if-no-files-found: error
          retention-days: 30

      - name: Build immutable archive chaosbox
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME}"
          test "$(nix develop -c cargo pkgid --locked -p chaosbox | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$version"
          mkdir -p "$RUNNER_TEMP/simit-crates/chaosbox"
          cp "$RUNNER_TEMP/simit-package-target/package/chaosbox-$version.crate" "$RUNNER_TEMP/simit-crates/chaosbox/"
      - name: Retain original-run archive chaosbox
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
