# Generated by simit. Manual edits will be reported as ci=drift.
# coordinated workspace publish: prerequisites before dependents.
# Before creating and pushing a release tag, run `simit changelog release <version>` locally.
# Required release trust roots and secrets:
# - keys/maintainers.gpg: pinned maintainer OpenPGP public keys for git verify-tag.
name: Publish Workspace

on:
  push:
    tags:
      - "[0-9]*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Validate signed release tag and lockstep versions
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          if ! printf '%s\n' "$tag" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then echo "Tag must be an exact semver version like 0.1.1, got '$tag'" >&2; exit 1; fi
          test -s keys/maintainers.gpg
          GNUPGHOME="$(mktemp -d)"; export GNUPGHOME; chmod 700 "$GNUPGHOME"
          gpg --batch --import keys/maintainers.gpg
          git fetch --force --tags origin "refs/tags/${tag}:refs/tags/${tag}"
          git verify-tag "$tag"
          validated_sha="$(git rev-list -n 1 "$tag")"
          test "$validated_sha" = "${GITHUB_SHA:?missing workflow event SHA}" || { echo "Signed tag commit does not match the workflow event SHA; refusing a moved tag" >&2; exit 1; }
          git checkout --detach "$validated_sha"
          test "$(nix develop -c cargo pkgid -p chaosbox-core | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "chaosbox-core 0.1.0 does not match tag $tag" >&2; exit 1; }
          test "$(nix develop -c cargo pkgid -p chaosbox-extract | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "chaosbox-extract 0.1.0 does not match tag $tag" >&2; exit 1; }
          test "$(nix develop -c cargo pkgid -p chaosbox-jev | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "chaosbox-jev 0.1.0 does not match tag $tag" >&2; exit 1; }
          test "$(nix develop -c cargo pkgid -p chaosbox-store | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "chaosbox-store 0.1.0 does not match tag $tag" >&2; exit 1; }
          test "$(nix develop -c cargo pkgid -p chaosbox-typedb | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "chaosbox-typedb 0.1.0 does not match tag $tag" >&2; exit 1; }
          test "$(nix develop -c cargo pkgid -p chaosbox | awk -F'[#@]' 'NF > 1 {print $NF}' | tail -n 1)" = "$tag" || { echo "chaosbox 0.1.0 does not match tag $tag" >&2; exit 1; }
  gate-package-inventory:
    needs: [validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Required gate package-inventory
        run: set -euo pipefail; for crate in chaosbox-core chaosbox-extract chaosbox-jev chaosbox-store chaosbox-typedb chaosbox; do nix develop -c cargo package -p "$crate" --allow-dirty --list; done
  publish-chaosbox-core:
    needs: [gate-package-inventory]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    env:
      NIX_CONFIG: "experimental-features = nix-command flakes"
      XDG_CACHE_HOME: "/tmp/.cache"
      CARGO_HOME: "/tmp/.cargo"
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install Nix
        uses: cachix/install-nix-action@630ae543ea3a38a9a4166f03376c02c50f408342 # v31

      - name: Configure GitHub input transport
        run: |
          git config --global --add url.https://github.com/.insteadOf ssh://git@github.com/
          git config --global --add url.https://github.com/.insteadOf git@github.com:

      - name: Add cargo bin to PATH
        run: echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"

      - name: Package archive with verification
        run: nix develop -c cargo package -p chaosbox-core --allow-dirty

      - name: Registry dry-run
        run: nix develop -c cargo publish -p chaosbox-core --dry-run

      - name: Publish
        env:
          CRATES_IO_API_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: |
          set -euo pipefail
          crate_name='chaosbox-core'
          version="${GITHUB_REF_NAME:-${GITHUB_REF#refs/tags/}}"
          if [ -z "$version" ]; then echo "Could not determine release version from tag ref" >&2; exit 1; fi
          # Preflight: fail fast on auth/ownership/validation vs propagation delay.
          if [ -z "${CRATES_IO_API_TOKEN:-}" ] && [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then echo "CRATES_IO_API_TOKEN is required to publish to crates.io" >&2; exit 1; fi
          export CARGO_REGISTRY_TOKEN="${CARGO_REGISTRY_TOKEN:-$CRATES_IO_API_TOKEN}"
          status="$(curl --retry 3 -sS -o /tmp/simit-crate.json -w '%{http_code}' -A 'simit publish-workspace preflight' "https://crates.io/api/v1/crates/${crate_name}/${version}" || echo 000)"
          case "$status" in
            200)
              echo "${crate_name} ${version} already exists on crates.io; verifying it is the intended release"
              published_checksum="$(jq -er --arg v "$version" '.version | select(.num == $v) | .checksum' /tmp/simit-crate.json 2>/dev/null || true)"
              local_crate="target/package/${crate_name}-${version}.crate"
              if [ -n "$published_checksum" ] && [ -f "$local_crate" ]; then
                local_checksum="$(sha256sum "$local_crate" | awk '{print $1}')"
                if [ "$local_checksum" = "$published_checksum" ]; then echo "checksum matches; resuming (already published)"; exit 0; fi
              fi
              echo "conflict: ${crate_name} ${version} exists but checksum does not match the local archive; refusing to treat as success" >&2; exit 1;;
            404) ;;
            401|403) echo "authorization/ownership failure checking ${crate_name} ${version} (HTTP $status)" >&2; exit 1;;
            *) echo "Could not check crates.io for ${crate_name} ${version} before publishing (HTTP $status)" >&2; exit 1;;
          esac
          nix develop -c cargo publish -p chaosbox-core
          # Bounded propagation wait: dependents need this version visible.
          for attempt in $(seq 1 20); do
            code="$(curl --retry 2 -sS -o /dev/null -w '%{http_code}' -A 'simit publish-workspace propagation' "https://crates.io/api/v1/crates/${crate_name}/${version}" || echo 000)"
            case "$code" in 200) echo "propagated ${crate_name} ${version} (attempt $attempt)"; break;; 404) echo "waiting for ${crate_name} ${version} (attempt $attempt/20)"; sleep 30;; 401|403) echo "authorization failure while waiting (HTTP $code)" >&2; exit 1;; *) echo "unexpected registry status $code while waiting" >&2; exit 1;; esac
            if [ "$attempt" = 20 ]; then echo "propagation timeout for ${crate_name} ${version}" >&2; exit 1; fi
          done

