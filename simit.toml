[ci]
runtime = "nix"
runner = "ubuntu-24.04"
workspace = true
with_nextest = true
with_docs = true
provider = "actions"
platform = "github"
publish_crates = true
nix_builds = [
  ".#packages.x86_64-linux.chaosbox",
  ".#checks.x86_64-linux.unit",
  ".#checks.x86_64-linux.lint",
  ".#checks.x86_64-linux.scratch-plugin",
  ".#checks.x86_64-linux.typedb-integration",
]

[ci.nix_build]
timeout_minutes = 180
max_parallel = 2
max_jobs = 1
cores = 2
kvm = true
capture_results = true
artifact_retention_days = 30
