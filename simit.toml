[ci]
runtime = "nix"
runner = "ubuntu-24.04"
workspace = true
with_nextest = true
with_docs = true
provider = "actions"
platform = "github"
publish_crates = true
nix_builds = [
  ".#packages.x86_64-linux.chaosbox",
  ".#checks.x86_64-linux.unit",
  ".#checks.x86_64-linux.lint",
  ".#checks.x86_64-linux.scratch-plugin",
  ".#checks.x86_64-linux.federation-home",
  ".#checks.x86_64-linux.intelligence-plugin",
  ".#checks.x86_64-linux.typedb-integration",
  ".#checks.x86_64-linux.federation-ssh",
]

[ci.nix_build]
timeout_minutes = 180
max_parallel = 2
max_jobs = 1
cores = 2
kvm = true
capture_results = true
artifact_retention_days = 30

# TypeDB comes from the qualified nixpkgs PR merge; reuse its signed public
# review outputs rather than compiling the server and console on VM runners.
[release.artifacts]
substituters = [
  "https://cache.nixos.org",
  "https://attic.candee.baby/nixpkgs-review-gha",
]
trusted_public_keys = [
  "cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=",
  "nixpkgs-review-gha:0fg7mYWpk0A2L627XE3tdW56J8dvZ2Y/+ATNjkcMfIE=",
]
